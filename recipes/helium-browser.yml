
recipe_version: 7
package:
  name: helium-browser
  version: 0.21.1.1
  description: A lightweight browser based on Chromium
  author: "Imput | Irun Official"
  id: "aaaa.0000.aaaa.0002"
  recipe_path: "~/.irun/pkg/helium-browser/helium-browser.yml"

install_method: "binary"

binary:
  url: "https://github.com/imputnet/helium-linux/releases/download/0.21.1.1/helium-0.21.1.1-x86_64_linux.tar.xz"
  additional_urls:
    - "https://github.com/darealzoko/Irun/blob/main/desktops/helium-browser.desktop"
  sha256: "6cd7f240153cb9c0cdfa27bf1a6651ddcae73a898afc449a93dd10da83b4bd45"
  bin_install_steps:
    - "mkdir -p ~/.irun/pkg/helium-browser/bin/"
    - "tar -xJf helium-0.21.1.1-x86_64_linux.tar.xz -C ~/.irun/pkg/helium-browser/bin/"
    - |
      mkdir -p ~/.local/share/applications ~/.local/share/icons
      cp ~/.irun/pkg/helium-browser/bin/helium-0.21.1.1-x86_64_linux/product_logo_256.png ~/.local/share/icons/helium.png
      cat > ~/.local/share/applications/helium-browser.desktop <<'EOF'
      [Desktop Entry]
      Version=1.0
      Name=Helium
      GenericName=Web Browser
      GenericName[fr]=Navigateur Web
      Comment=Access the Internet
      Comment[fr]=Accéder à Internet
      Exec=/usr/local/bin/helium %U
      StartupNotify=true
      Terminal=false
      Icon=helium
      Type=Application
      Categories=Network;WebBrowser;
      StartupWMClass=helium-browser
      MimeType=application/pdf;application/rdf+xml;application/rss+xml;application/xhtml+xml;application/xhtml_xml;application/xml;image/gif;image/jpeg;image/png;image/webp;text/html;text/xml;x-scheme-handler/http;x-scheme-handler/https;
      Actions=new-window;new-private-window;

      [Desktop Action new-window]
      Name=New Window
      Name[fr]=Nouvelle fenêtre
      Exec=/usr/local/bin/helium

      [Desktop Action new-private-window]
      Name=New Incognito Window
      Name[fr]=Nouvelle fenêtre de navigation privée
      Exec=/usr/local/bin/helium --incognito
      EOF
      chmod 644 ~/.local/share/applications/helium-browser.desktop
      update-desktop-database ~/.local/share/applications/
      desktop-file-validate ~/.local/share/applications/helium-browser.desktop
    - "if [ -e /usr/local/bin/helium ]; then sudo rm -f /usr/local/bin/helium; fi"
    - "sudo ln -s ~/.irun/pkg/helium-browser/bin/helium-0.21.1.1-x86_64_linux/helium /usr/local/bin/helium"

dependencies:
  runtime:
    - "tar"
