recipe_version: 1
package:
  name: helium-browser
  version: 0.20.3.1
  description: A lightweight browser based on Chromium
  author: "Imput | Irun Official"
  id: "aaaa.0000.aaaa.0002"
  recipe_path: "~/Bureau/helium-browser.yml"

install_method: "binary"

binary:
  url: "https://github.com/imputnet/helium-linux/releases/download/0.20.3.1/helium-0.20.3.1-x86_64_linux.tar.xz"
  additional_urls:
    - "https://github.com/darealzoko/Irun/blob/main/desktops/helium-browser.txt"
  sha256: 3759ea4e95bf4ef4a0a6477e3d73576b0f03906f2e80357275bfc6cacafb5fac
  bin_install_steps:
    - "mkdir -p ~/.irun/pkg/helium-browser/bin/"
    - "tar -xJf helium-0.20.3.1-x86_64_linux.tar.xz -C ~/.irun/pkg/helium-browser/bin/"
    - "cp ~/.irun/tmp/helium-browser.txt ~/.local/share/applications/helium-browser.desktop"
    - "kbuildsycoca6 --noincremental"

dependencies:
  runtime:
    - "tar"
