recipe_version: 5
package:
  name: firefox
  version: 161.0b1.build1
  description: "Firefox Browser, by Mozilla."
  author: "Mozilla | Irun Official"
  id: "aaaa.0000.aaaa.0005"

install_method: "binary"

binary:
  url: "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64"
  additional_urls: []
  sha256: ""
  bin_install_steps:
    - "mkdir -p ~/.irun/tmp/firefox/"
    - "mkdir -p ~/.irun/pkg/firefox/bin"
    - "tar -xf ~/.irun/tmp/firefox-checkout"
    - "cp -r ~/.irun/tmp/firefox/* ~/.irun/pkg/firefox/bin/"
    - "if [ -e /usr/local/bin/firefox ]; then sudo rm -f /usr/local/bin/firefox; fi"
    - "sudo ln -s ~/.irun/pkg/firefox/bin/firefox /usr/local/bin/firefox"
dependencies:
  runtime:
    - ""
  build:
    - ""
