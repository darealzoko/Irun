recipe_version: 2
package:
  name: Notys
  version: 1.10.0
  description: note app
  author: "_zoko | Irun Official"
  id: "aaaa.0000.aaaa.0001"

install_method: "binary"

binary:
  url: "https://github.com/darealzoko/Notys/releases/download/v1.10.0/Notys-linux-1.10.0.zip"
  additional_urls: []
  sha256: "c3d9986b78effaac99483d27465e37f8f92f23bd340475187f467d249ae05ede"
  bin_install_steps:
    - "mkdir -p ~/.irun/pkg/notys/bin/"
    - "unzip ~/.irun/tmp/Notys-linux-1.10.0.zip -d ~/.irun/pkg/notys/bin/"

source:
  url: "https://github.com/darealzoko/Notys/releases/download/v1.10.0/Notys-build-env-1.10.0.zip"
  additional_urls: []
  sha256: "e358a91941430eaae4dfcefde5e2e3cedeb32f885d48f0ec0b3e1904460b4457"
  build_steps:
    - "unzip ~/.irun/tmp/Notys-build-env-1.10.0.zip -d ~/.irun/pkg/notys/tmp/"
    - "cd ~/.irun/pkg/notys/tmp/Notys/"
    - "python3 -m pip install --upgrade pip"
    - "python3 -m pip install -r requirements.txt pyinstaller"
    - "python3 -m PyInstaller --noconfirm Notys.spec"
  install_steps:
    - "mkdir -p ~/.irun/pkg/notys/bin/"
    - "mv dist/Notys/* ~/.irun/pkg/notys/bin/"
  
dependencies:
  runtime:
    - "python3"
    - "python3-tk"
  build:
    - "python3-pip"
