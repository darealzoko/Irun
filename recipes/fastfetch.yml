recipe_version: 7
package:
  name: fastfetch
  version: 2.71.0
  description: "A maintained, feature-rich and performance oriented, neofetch like system information tool."
  author: "Linus Dierheimer | Irun Official"
  id: "aaaa.0000.aaaa.0004"

install_method: "source"

source:
  url: "https://github.com/fastfetch-cli/fastfetch.git"
  additional_urls: []
  sha256: ""
  build_steps:
    - "mkdir -p ~/.irun/tmp/fastfetch.git/build"
    - "cmake -S  ~/.irun/tmp/fastfetch.git -B ~/.irun/tmp/fastfetch.git/build"
    - "cmake --build ~/.irun/tmp/fastfetch.git/build --target fastfetch"
  install_steps:
    - "mkdir -p ~/.irun/pkg/fastfetch/bin"
    - "cp ~/.irun/tmp/fastfetch.git/build/fastfetch ~/.irun/pkg/fastfetch/bin/fastfetch"
    - "sleep 5"
    - "if [ -e $HOME/local/bin/fastfetch ]; then sudo rm -f $HOME/local/bin/fastfetch; fi"
    - "sudo ln -s ~/.irun/pkg/fastfetch/bin/fastfetch $HOME/local/bin/fastfetch"

dependencies:
  runtime:
    - ""
  build:
    - "CMake"
    - "vulkan-headers"
